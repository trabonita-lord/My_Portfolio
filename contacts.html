<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | My Portfolio</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <ul class="nav-menu">
                <li><a href="/index.html/index.html" class="nav-link">Home</a></li>
                <li><a href="/index.html/about.html" class="nav-link">About</a></li>
                <li><a href="/index.html/projects.html" class="nav-link">Projects</a></li>
                <li><a href="/index.html/contacts.html" class="nav-link active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="content-section">
            <div class="container">
                <h1>Get In Touch</h1>

                <div class="contact-wrapper">
                    <section class="contact-info">
                        <h2>Contact Information</h2>
                        <div class="info-item">
                            <h3>Email</h3>
                            <p><a href="mailto:contact@example.com">YourName@example.com</a></p>
                        </div>
                        <div class="info-item">
                            <h3>Phone</h3>
                            <p>09356789123</p>
                        </div>
                        <div class="info-item">
                            <h3>Location</h3>
                            <p>Camarines Sur, Nabua</p>
                        </div>
                        <div class="info-item">
                            <h3>Follow Me</h3>
                            <div class="social-links">
                                <a href="#" class="social-link">LinkedIn</a>
                                <a href="#" class="social-link">GitHub</a>
                            </div>
                        </div>
                    </section>

                    <section class="contact-form-section">
                        <h2>Send Me a Message</h2>
                        <form class="contact-form">
                            <div class="form-group">
                                <label for="name">Name:</label>
                                <input type="text" id="name" name="name" required>
                            </div>

                            <div class="form-group">
                                <label for="email">Email:</label>
                                <input type="email" id="email" name="email" required>
                            </div>

                            <div class="form-group">
                                <label for="subject">Subject:</label>
                                <input type="text" id="subject" name="subject" required>
                            </div>

                            <div class="form-group">
                                <label for="message">Message:</label>
                                <textarea id="message" name="message" rows="5" required></textarea>
                            </div>

                            <button type="submit" class="btn btn-submit">Send Message</button>
                        </form>
                    </section>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Tristan. All rights reserved.</p>
    </footer>
</body>
</html>
